name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA (tags can be repointed: the
# tj-actions/changed-files compromise in 2025 worked exactly that way).

defaults:
  run:
    working-directory: backend

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history, not just the last commit
      - name: gitleaks over all commits
        shell: bash
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --no-banner -v /repo 2>&1 | tee gitleaks.log
          # gitleaks exits 0 when git refuses the repo and it scans nothing; don't trust that.
          grep -Eq "[1-9][0-9]* commits scanned" gitleaks.log || { echo "::error::gitleaks scanned 0 commits"; exit 1; }

  quality:
    name: lint · typecheck · unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Validate agent definitions (R15.2)
        run: uv run runtime agents validate
      - run: uv run pytest -m "not integration"

  integration:
    name: migrations · integration · coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_DB: agent_runtime
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent -d agent_runtime"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    # Throw-away credentials for an ephemeral service container: not secrets, so
    # plain env is fine. Real secrets would come from GitHub Environment secrets.
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: agent_runtime
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ci-only
      REDIS_URL: redis://localhost:6379/0
      API_POSTGRES_USER: agent_api
      API_POSTGRES_PASSWORD: ci-only-api
      WORKER_POSTGRES_USER: agent_worker
      WORKER_POSTGRES_PASSWORD: ci-only-worker
      REQUIRE_SERVICES: "1" # missing services fail the tests instead of skipping them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: Migrate (our schema + LangGraph's tables), as the deploy will
        run: uv run runtime db upgrade && uv run runtime db provision-users
      - name: All tests with coverage (fails under the floor in pyproject.toml)
        run: uv run pytest --cov --cov-report=term

  ui:
    name: ui · lint · types · tests · build · API drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint, strict types, unit tests with coverage, production build (Node in a pinned container)
        run: make ui-check
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: The UI's API types match the API (regenerate, then no diff)
        run: |
          (cd backend && uv sync --locked)
          make ui-api
          git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts \
            || { echo "::error::the API changed: run 'make ui-api' and commit the result"; exit 1; }

  containers:
    name: images · scan · setup · container + browser e2e
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Room for the stack's images and volumes (the runner's unused toolchains go)
        # With L7's Tempo and Loki the runner's disk passed 90%, and Loki refused writes.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1
      - name: setup.ps1 parses and passes PSScriptAnalyzer (Windows path; not run here)
        shell: pwsh
        run: |
          $errs = $null; $tok = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/setup.ps1", [ref]$tok, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { "::error::setup.ps1:$($_.Extent.StartLineNumber) $($_.Message)" }; exit 1 }
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path setup.ps1 -Severity Error
          $issues | Format-Table -AutoSize | Out-String -Width 200
          if ($issues) { exit 1 }
      - name: First run, exactly as a tester does it (builds the images)
        run: ./setup.sh --non-interactive --model scripted --build
      - name: Second run changes nothing (idempotent)
        run: |
          before=$(sha256sum .env)
          ./setup.sh --non-interactive
          [ "$before" = "$(sha256sum .env)" ] || { echo "::error::setup changed .env on a re-run"; exit 1; }
      - name: Scan the images (fail on fixable HIGH/CRITICAL)
        run: |
          for image in runtime ui; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
              image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
              "ghcr.io/sofianebouabdallahh-ai/durable-langgraph-runtime/$image:$(cat VERSION)"
          done
      - name: The images run as non-root users
        run: |
          check() { uid=$(docker run --rm --entrypoint id "ghcr.io/sofianebouabdallahh-ai/durable-langgraph-runtime/$1:$(cat VERSION)" -u)
                    [ "$uid" = "$2" ] || { echo "::error::$1 runs as uid $uid"; exit 1; }; }
          check runtime 10001
          check ui 101
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Container e2e (kill / stop a worker mid-turn, least privilege)
        working-directory: backend
        run: uv run --locked python -m tests.e2e.compose_e2e all
      - name: Turn on the observability profile (L4a; the steps above ran with it off)
        run: ./setup.sh --non-interactive --observability
      - name: Browser e2e (Playwright in a container, against the stack, with tracing on)
        working-directory: .
        run: |
          # the fake model the connection tests use (profile `test`, never in setup)
          docker compose --file infra/compose/docker-compose.yml --env-file .env --profile test up -d --wait fake-model
          # the fake web (L6a): the page reader may read from fake-model, tests only
          echo "FETCH_ALLOW_HOSTS=fake-model" >> .env
          # the browser container reaches the UI as `ui`: one of its names (H3, else 421)
          echo "UI_HOSTNAMES=ui" >> .env
          docker compose --file infra/compose/docker-compose.yml --env-file .env up -d --wait fetcher api ui
          make ui-e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: frontend/e2e/playwright-report
          retention-days: 7
      - name: Diagnostics bundle (kept for 7 days)
        if: always()
        run: ./setup.sh --doctor || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: diagnostics
          path: diagnostics-*.tar.gz
          retention-days: 7

  kubernetes:
    name: kubernetes (kind) · chart · smoke · podkill · upgrade · security
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Room for three kind nodes' images (the runner's unused toolchains go)
        # Every image is loaded into each node (runtime, UI, sandbox, SearXNG, …), and the
        # upgrade demo loads another tag: with L6 the runner ran out of disk mid-demo.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1
      - name: The pinned tools (kind, helm, kubectl), checksums verified
        run: infra/kind/tools.sh
      - name: Lint and validate both charts (helm lint, kubeconform)
        run: |
          curl -fsSL -o /tmp/kc.tgz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  /tmp/kc.tgz" | sha256sum -c -
          tar -xzf /tmp/kc.tgz -C /tmp kubeconform
          make k8s-lint
          for values in values.yaml values-kind.yaml values-cloud.example.yaml; do
            .tools/bin/helm template nuria infra/helm/agent-runtime -f infra/helm/agent-runtime/$values \
              | /tmp/kubeconform -strict -summary -kubernetes-version 1.37.0 -ignore-missing-schemas
          done
          .tools/bin/helm template nuria-data infra/helm/nuria-data | /tmp/kubeconform -strict -summary -kubernetes-version 1.37.0
          # H3: a public host with nothing asking for a password must refuse to render
          if .tools/bin/helm template nuria infra/helm/agent-runtime -f infra/helm/agent-runtime/values-cloud.example.yaml \
               --set ingress.basicAuthSecret= >/dev/null 2>&1; then
            echo "::error::the chart rendered a public ingress host with no password in front"; exit 1
          fi
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: First run on Kubernetes, as a tester does it (cluster, images, charts, smoke turn)
        run: ./setup.sh --non-interactive --model scripted --kubernetes
      - name: Demos (each prints PASS/FAIL)
        working-directory: backend
        run: uv run --locked python -m tests.e2e.k8s_e2e security && uv run --locked python -m tests.e2e.k8s_e2e podkill && uv run --locked python -m tests.e2e.k8s_e2e upgrade
      - name: Diagnostics (events, pods, logs, describe)
        if: failure()
        run: |
          mkdir -p k8s-diagnostics
          K=".tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-nuria"
          $K get events -A --sort-by=.lastTimestamp > k8s-diagnostics/events.txt 2>&1 || true
          $K get all,pdb,hpa,scaledobject,networkpolicy -A -o wide > k8s-diagnostics/objects.txt 2>&1 || true
          $K -n nuria describe pods > k8s-diagnostics/describe-pods.txt 2>&1 || true
          for p in $($K -n nuria get pods -o name); do $K -n nuria logs "$p" --all-containers --prefix --tail 500 >> k8s-diagnostics/logs.txt 2>&1 || true; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: k8s-diagnostics
          path: k8s-diagnostics
          retention-days: 7

  upgrade:
    name: update from the previous release keeps everything; restore brings it back
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags: the previous release is the newest v* (else phase-*) tag
      - name: Install the previous release with data, ./setup.sh --update to this commit, then --restore
        run: infra/ci/upgrade.sh
