# How every /api request is proxied (included by the /api locations in default.conf).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_buffering off;
proxy_cache off;
proxy_read_timeout 1h;  # a stream is open as long as the chat is
proxy_connect_timeout 1s;  # same host network: a connect takes milliseconds
# A replica that's down or draining: try the next, every address if need be
# (idempotent requests only; nginx never retries a POST by default).
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 0;
proxy_next_upstream_timeout 10s;
