# The UI and the API behind one origin.
#
# The API runs as several replicas (`api` resolves to each). nginx re-resolves the
# name every 2 s (`resolve`, nginx >= 1.27.3), so it follows replicas that restart
# or scale, and a request that can't reach one goes to the next (AC20).
#
# No passive health marking (max_fails=0): when a replica dies, its stale address
# and its restarting successor both fail for a few seconds, and marking each "down"
# would leave *no* live upstream (502) although another replica is healthy. Instead
# every request tries the addresses in turn until one answers; a dead one costs at
# most the 1 s connect timeout, and only until the next re-resolve drops it.

resolver 127.0.0.11 valid=2s ipv6=off;  # Docker's embedded DNS: local, cheap to ask

# Which replica answered, and how (diagnostics: ./setup.sh --doctor collects it).
log_format upstreams '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                     'upstream=$upstream_addr status=$upstream_status connect=$upstream_connect_time '
                     'total=$request_time';

upstream api {
    zone api 64k;
    server api:8000 resolve max_fails=0;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log /dev/stdout upstreams;
    root /usr/share/nginx/html;
    client_max_body_size 256k;  # a message is at most 32 KB (R14.5)

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The API, without its /api prefix. Streams (SSE) pass through unbuffered.
    location /api/ {
        include /etc/nginx/snippets/api-proxy.conf;
        proxy_pass http://api/;
    }

    # Uploads are the only large bodies: a skill (≤ 10 MB) or an agent (≤ 1 MB).
    location ~ ^/api/(skills/([0-9a-f-]+/)?upload|studio/import)$ {
        client_max_body_size 11m;
        rewrite ^/api/(.*)$ /$1 break;
        include /etc/nginx/snippets/api-proxy.conf;
        proxy_request_buffering on;  # the body reaches the API whole, never half-sent
        proxy_pass http://api;
    }

    # The API's own docs page (Swagger UI loads from a CDN, with inline script).
    location ~ ^/(docs|openapi\.json)$ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Hashed build output: cached for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The app: any other path is the single page; never cached, so an update shows.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
