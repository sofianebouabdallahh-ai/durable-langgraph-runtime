# Alembic configuration. The database URL is NOT here: migrations/env.py reads it
# from agent_runtime.config.Settings, so there is one source of configuration (R9.1).

[alembic]
script_location = %(here)s/migrations
# Revision files are named by explicit, ordered ids: 0001_initial_schema.py, ...
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
