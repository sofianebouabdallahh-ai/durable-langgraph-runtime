[project]
name = "durable-agent-runtime"
version = "0.1.0"
description = "Durable, distributed runtime for LangGraph agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=45",
    "fastapi>=0.141.1",
    "httpx>=0.28",
    "langchain>=1.4.2",
    "langchain-openai>=1.0",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "mcp>=2.3.0,<3",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    "opentelemetry-sdk>=1.45.0",
    "prometheus-client>=0.26.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pypdf>=5",
    "python-frontmatter>=1.3.0",
    "redis[hiredis]>=8.1.0",
    "sqlalchemy>=2.1.1",
    "trafilatura>=2",
    "uuid-utils>=0.17.1",
    "uvicorn[standard]>=0.54.0",
    "websockets>=16.1.1",
]

[project.scripts]
runtime = "agent_runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.uv]
# Supply-chain cooldown: never resolve a package version uploaded after this
# date, so a freshly published (possibly compromised) release can't slip in.
# Absolute (not "14 days") so `uv lock` is reproducible; bump it deliberately
# in a dependency-update PR, keeping it ~2 weeks behind the bump date.
exclude-newer = "2026-09-27T00:00:00Z"
# Exceptions, one package each, for a security fix newer than the cooldown:
# certifi 2026.10.19 removes emSign roots with compromised intermediate keys
# (GHSA-6q48-6c7w-9gw2, critical). mcp 2.3.0 (2026-10-02, the MCP client of L8; its
# types package ships with it). Drop an exception once the cooldown passes it.
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z", mcp = "2026-10-03T00:00:00Z", mcp-types = "2026-10-03T00:00:00Z" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.168.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear: likely bugs
    "UP",       # pyupgrade: modern syntax
    "SIM",      # simplifications
    "RUF",      # ruff-specific
    "ASYNC",    # async pitfalls (blocking calls in async code)
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests", "migrations"]

# -------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["agent_runtime"]
branch = true  # count both sides of every if, not just lines
# The crash test runs `runtime` in child processes; record their coverage too.
parallel = true
concurrency = ["thread"]
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 90  # ratchet: raise as coverage grows, never lower it
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", 'if __name__ == "__main__":']

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs Postgres/Redis running (make up)",
    "e2e: real API and worker processes (tests/e2e); also marked integration",
    "live: needs a real model provider (make llm-up); never in CI",
]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
# One event loop for the whole session, so a session-scoped connection pool
# can be shared by every async test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
