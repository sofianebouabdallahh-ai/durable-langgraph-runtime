# Redis with AOF (R10.9): the work stream and its pending entries survive a restart.
# It holds nothing that can't be rebuilt from Postgres (the outbox relay re-sends).
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {{- include "nuria-data.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: redis }
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels: {{- include "nuria-data.labels" . | nindent 4 }}
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        {{- include "nuria-data.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # With redis.passwordKey set, the password (H10) comes from the Secret, and the
          # kubelet expands $(REDIS_PASSWORD) in the arguments.
          args: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--dir", "/data"{{ if .Values.redis.passwordKey }}, "--requirepass", "$(REDIS_PASSWORD)"{{ end }}]
          {{- if .Values.redis.passwordKey }}
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: {{ .Values.redis.passwordKey }} } }
            - name: REDISCLI_AUTH # the probes' redis-cli
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: {{ .Values.redis.passwordKey }} } }
          {{- end }}
          securityContext: {{- include "nuria-data.containerSecurity" . | nindent 12 }}
          ports:
            - { name: redis, containerPort: 6379 }
          # redis-cli exits 0 on a NOAUTH reply too, so the reply itself is tested.
          readinessProbe:
            exec: { command: ["sh", "-c", "redis-cli ping | grep -q PONG"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "redis-cli ping | grep -q PONG"] }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: {{ .Values.redis.storage }} } }
---
# One replica on a node-local volume: never evicted for a drain (it would be down
# until its node is back). A drain of its node waits; see values.yaml.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis
  labels: {{- include "nuria-data.labels" . | nindent 4 }}
spec:
  maxUnavailable: 0
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
