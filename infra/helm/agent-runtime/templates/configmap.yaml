# Non-secret configuration for every runtime pod (R10.4). Pods carry its checksum,
# so changing it rolls them (a ConfigMap is only read at start).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nuria.fullname" . }}-config
  labels: {{- include "nuria.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  # Phase H3: the names browser requests may carry (the ingress host), and the names of
  # Nuria's own Services, which outbound requests (MCP, models, search) never reach.
  UI_HOSTNAMES: {{ .Values.ingress.host | default "" | quote }}
  INTERNAL_HOSTS: {{ include "nuria.internalHosts" . | quote }}
  {{- if not (hasKey .Values.config "ADMIN_API_ENABLED") }}
  ADMIN_API_ENABLED: "false"  # the kill switch works through the agents API
  {{- end }}
  {{- include "nuria.toolsConfig" . | nindent 2 }}
