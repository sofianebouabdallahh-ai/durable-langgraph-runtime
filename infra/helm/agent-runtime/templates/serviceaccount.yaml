# Nuria's pods never call the Kubernetes API: a dedicated account, with no token
# mounted (R10.10), so a compromised pod has no cluster credentials to steal.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nuria.fullname" . }}
  labels: {{- include "nuria.labels" . | nindent 4 }}
automountServiceAccountToken: false
