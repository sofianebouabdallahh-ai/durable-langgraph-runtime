# SearXNG for Nuria's web search (phase L6a): private, in the stack, no key.
# Only the defaults we need to change; everything else is SearXNG's own.
use_default_settings: true

general:
  instance_name: "Nuria search"

search:
  safe_search: 1
  # Agents read results as JSON (off by default in SearXNG).
  formats:
    - html
    - json

server:
  # Reached only from inside the stack (no host port): no public-instance protections.
  limiter: false
  public_instance: false
  image_proxy: false
  # secret_key comes from the environment (SEARXNG_SECRET, generated by setup).

# SearXNG's default web engines are only Brave, DuckDuckGo and Google's: from one home
# connection they soon answer "too many requests" or a CAPTCHA, all at once. One more
# engine keeps search working while they're suspended (merged into the defaults by name).
engines:
  - name: yahoo
    disabled: false
