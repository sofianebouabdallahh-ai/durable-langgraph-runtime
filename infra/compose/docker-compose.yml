# The local stack (R9.2).
#
#   default (`make up`):  Postgres + Redis only. Developers run the API and workers
#                         on the host with uv (`make api`, `make worker`).
#   profile `app`:        the whole product in containers: migrate (one-shot), the UI
#                         (the one entry point: http://localhost:3000, /api → API),
#                         2 API replicas, 2 workers. What `./setup.sh` starts for testers.
#   profile `llm`:        Ollama in Docker (CPU-only on macOS: prefer the native app).
#
# Run it through the root Makefile or setup.sh, which pass the root .env:
#   docker compose --file infra/compose/docker-compose.yml --env-file .env ...
#
# Ports bind to 127.0.0.1 so nothing is exposed on the LAN.

name: agent-runtime

x-runtime: &runtime
  image: ${RUNTIME_IMAGE:-ghcr.io/sofianebouabdallahh-ai/durable-langgraph-runtime/runtime:latest}
  build: ../../backend
  profiles: ["app"]
  env_file: ../../.env
  # Inside the network services are reached by name; these override the
  # host-oriented values in .env (localhost), which the developer loop uses.
  environment: &runtime-env
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    OLLAMA_BASE_URL: ${CONTAINER_OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
    # The offline demo model streams its replies word by word, like a real one.
    SCRIPTED_STREAMING: ${SCRIPTED_STREAMING:-true}
    SCRIPTED_STREAM_DELAY_S: ${SCRIPTED_STREAM_DELAY_S:-0.03}
  extra_hosts:
    - "host.docker.internal:host-gateway" # a model server on the host (Linux; macOS/Windows have it)
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  migrate:
    <<: *runtime
    command: ["db", "init"] # migrate + provision the component logins (idempotent)
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *runtime
    command: ["api", "--host", "0.0.0.0", "--port", "8000"]
    # Several replicas behind the UI's proxy: any of them serves any stream (AC3), and
    # losing one mid-reply is invisible to the chat (AC20). No host port of its own.
    deploy:
      replicas: ${API_REPLICAS:-2}
    environment:
      <<: *runtime-env
      # Least privilege (R14.13): the API connects as its own login, not the owner.
      POSTGRES_USER: ${API_POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${API_POSTGRES_PASSWORD:?set in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).status == 200 else 1)"]
      interval: 3s
      timeout: 5s
      retries: 40
    stop_grace_period: 15s # drain: streams are asked to reconnect (R10.7)

  worker:
    <<: *runtime
    command: ["worker", "--workers", "1", "--concurrency", "${WORKER_CONCURRENCY:-4}"]
    deploy:
      replicas: ${WORKERS:-2}
    environment:
      <<: *runtime-env
      POSTGRES_USER: ${WORKER_POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${WORKER_POSTGRES_PASSWORD:?set in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # SIGTERM → finish the current step, release the run to another worker (R10.7).
    stop_grace_period: 40s

  ui:
    image: ${UI_IMAGE:-ghcr.io/sofianebouabdallahh-ai/durable-langgraph-runtime/ui:latest}
    build: ../../frontend
    profiles: ["app"]
    ports:
      - "127.0.0.1:${UI_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres:
    image: pgvector/pgvector:0.8.0-pg16 # Postgres 16 + pgvector (R4.5)
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    # AOF on: the work stream and its pending entries survive a Redis restart.
    # Redis is still rebuildable from Postgres; AOF just avoids needless recovery.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Local model server (R3.1), opt-in: `make llm-up` (profile `llm`). In Docker on
  # macOS it runs on the CPU (no Metal): fine for demos, slower than the native app.
  # Pinned to a release at least two weeks old (supply-chain cooldown, as in uv.lock).
  ollama:
    image: ollama/ollama:0.34.4
    profiles: ["llm"]
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "30m" # keep the model loaded between demo turns
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  redis-data:
  ollama-models:
