# The local cluster (R10.2): one control plane and two workers, so pods spread
# across nodes and a node can be drained while Nuria keeps answering.
#
# Traefik (the Ingress controller) runs on the control plane with hostPort 80;
# kind maps that to 127.0.0.1:${K8S_PORT} on this machine (default 8090). The
# placeholder is filled in by infra/kind/cluster.sh.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: nuria
# Processes per pod (a node setting): a fork bomb in a code sandbox stops here, not at
# the node's limit (L6c). Only for clusters created after this line; `down`, then `up`.
kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    podPidsLimit: 4096
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: ${K8S_PORT}
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
